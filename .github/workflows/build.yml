name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          
      # 1. Создаем структуру проекта (папку android и т.д.)
      - run: flutter create . --project-name slivy_vpn --org com.example
      
      # 2. Принудительно обновляем Android Gradle Plugin до 8.1.0, 
      # чтобы flutter_vless смог использовать метод packaging()
      - run: |
          sed -i 's/com.android.application" version "[^"]*"/com.android.application" version "8.1.0"/' android/settings.gradle
          sed -i 's/com.android.library" version "[^"]*"/com.android.library" version "8.1.0"/' android/settings.gradle
          
      - run: flutter pub get
      - run: flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: slivy-vpn-apk
          path: build/app/outputs/flutter-apk/app-release.apk
